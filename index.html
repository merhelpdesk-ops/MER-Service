<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MER 客户支持服务</title>
  <style>
    :root {
      --primary-color: #10B981;
      --primary-hover: #059669;
    }

    /* 仅精确隐藏 Crisp 原生右下角的默认启动图标，保留聊天面板正常渲染 */
    .crisp-client a[data-crisp-element="chat:icon"],
    .crisp-client div[data-crisp-element="chat:unread"] {
      display: none !important;
    }

    /* 移动端适配：当聊天窗口打开时，确保全屏或正常层级覆盖 */
    .crisp-client .cc-kv30 {
      z-index: 999990 !important;
    }

    /* 自定义胶囊形态在线客服按钮 */
    #mer-chat-trigger {
      position: fixed;
      bottom: 28px;
      right: 20px;
      height: 48px;
      padding: 0 18px;
      background-color: var(--primary-color);
      color: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 999989;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #mer-chat-trigger:active {
      transform: scale(0.96);
      background-color: var(--primary-hover);
    }

    #mer-chat-trigger svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #34D399;
      border-radius: 50%;
      box-shadow: 0 0 6px #34D399;
    }
  </style>

  <!-- Crisp SDK 配置 -->
  <script type="text/javascript">
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "9beb0458-5fd0-49c4-ba0c-7f99ab3c851a";
    (function() {
      d = document;
      s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();

    // 基础配置与主题色同调
    $crisp.push(["safe", true]);
    $crisp.push(["set", "theme:color", ["emerald"]]);

    // 监听聊天窗口关闭，确保自定义按钮恢复显示
    $crisp.push(["on", "chat:closed", function() {
      document.getElementById("mer-chat-trigger").style.display = "flex";
    }]);

    // 交互逻辑
    function toggleCustomChat() {
      if ($crisp.is("chat:opened")) {
        $crisp.push(["do", "chat:close"]);
      } else {
        $crisp.push(["do", "chat:open"]);
      }
    }
  </script>
</head>
<body style="background-color: #0b0f17; margin: 0; padding: 0;">

  <!-- 自定义绿色客服按钮 -->
  <div id="mer-chat-trigger" onclick="toggleCustomChat()">
    <span class="status-dot"></span>
    <svg viewBox="0 0 24 24">
      <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
    </svg>
    <span>在线客服</span>
  </div>

</body>
</html>
