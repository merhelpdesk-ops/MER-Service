  <!-- Crisp SDK -->
  <script type="text/javascript">
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "9beb0458-5fd0-49c4-ba0c-7f99ab3c851a";

    (function() {
      var d = document;
      var s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();

    $crisp.push(["safe", true]);
    $crisp.push(["set", "theme:color", ["emerald"]]);
    $crisp.push(["do", "chat:hide"]);

    // 动态向 Crisp 内部/Shadow DOM 或 iframe 注入 CSS 来强制隐藏顶部按钮
    function injectCrispCustomStyle() {
      const crispContainer = document.querySelector('.crisp-client');
      if (!crispContainer) return;

      // 如果 Crisp 使用了 Shadow DOM
      if (crispContainer.shadowRoot) {
        let style = crispContainer.shadowRoot.querySelector('#custom-crisp-hide-style');
        if (!style) {
          style = document.createElement('style');
          style.id = 'custom-crisp-hide-style';
          style.innerHTML = `
            [data-a-title="Messages"], 
            [data-role="button"][data-a-title*="Message"],
            div[data-is-header="true"] > div > span:first-child { 
              display: none !important; 
            }
          `;
          crispContainer.shadowRoot.appendChild(style);
        }
      }

      // 针对 iframe 内部的穿透注入
      const crispIframe = document.querySelector('iframe[name*="crisp"]');
      if (crispIframe && crispIframe.contentDocument) {
        let style = crispIframe.contentDocument.querySelector('#custom-crisp-hide-style');
        if (!style) {
          style = crispIframe.contentDocument.createElement('style');
          style.id = 'custom-crisp-hide-style';
          style.innerHTML = `
            [data-a-title="Messages"], 
            [data-role="button"][data-a-title*="Message"],
            div[data-is-header="true"] > div > span:first-child { 
              display: none !important; 
            }
          `;
          crispIframe.contentDocument.head.appendChild(style);
        }
      }
    }

    $crisp.push(["on", "session:loaded", function() {
      var triggerBtn = document.getElementById("mer-chat-trigger");

      $crisp.push(["on", "chat:closed", function() {
        $crisp.push(["do", "chat:hide"]);
        if (triggerBtn) triggerBtn.style.display = "inline-flex";
      }]);

      $crisp.push(["on", "chat:opened", function() {
        // 每次打开聊天框时强行注入样式
        setTimeout(injectCrispCustomStyle, 100);
        setTimeout(injectCrispCustomStyle, 500);
      }]);
    }]);

    function toggleCustomChat() {
      if (typeof $crisp === "undefined") return;
      var triggerBtn = document.getElementById("mer-chat-trigger");

      if ($crisp.is("chat:opened")) {
        $crisp.push(["do", "chat:close"]);
      } else {
        $crisp.push(["do", "chat:show"]);
        $crisp.push(["do", "chat:open"]);
        if (triggerBtn) triggerBtn.style.display = "none";
        setTimeout(injectCrispCustomStyle, 200);
      }
    }

    function toggleFaq(element) {
      const parent = element.parentElement;
      parent.classList.toggle('active');
    }
  </script>
