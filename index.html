<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MER Finance | 智能客户支持中心</title>
  <style>
    :root {
      --primary: #10B981;
      --primary-glow: rgba(16, 185, 129, 0.4);
      --bg-main: #0B0F17;
      --card-bg: rgba(22, 30, 46, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-title: #FFFFFF;
      --text-sub: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-title);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 动态背景光晕效果 */
    .glow-bg {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--primary-glow) 0%, rgba(11, 15, 23, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    /* 顶部导航 */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      background: rgba(11, 15, 23, 0.7);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #10B981, #059669);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    /* 主内容区 */
    main {
      flex: 1;
      padding: 24px 20px 100px;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    /* Hero Banner 头部标语 */
    .hero {
      text-align: center;
      margin: 20px 0 32px;
    }

    .hero-tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .hero h1 {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--text-sub);
      font-size: 14px;
    }

    /* 快捷功能卡片 */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .card:active {
      transform: scale(0.98);
      border-color: var(--primary);
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card p {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 常见问题区 */
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .faq-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #E5E7EB;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 自定义绿色客服按钮 */
    #mer-chat-trigger {
      position: fixed;
      bottom: 28px;
      right: 20px;
      height: 48px;
      padding: 0 20px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 24px;
      box-shadow: 0 8px 24px var(--primary-glow);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 999999;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #mer-chat-trigger:active {
      transform: scale(0.95);
    }

    #mer-chat-trigger svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #34D399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34D399;
    }
  </style>

  <!-- Crisp SDK -->
  <script type="text/javascript">
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "9beb0458-5fd0-49c4-ba0c-7f99ab3c851a";

    (function() {
      var d = document;
      var s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();

    $crisp.push(["safe", true]);
    $crisp.push(["set", "theme:color", ["emerald"]]);
    $crisp.push(["do", "chat:hide"]);

    $crisp.push(["on", "session:loaded", function() {
      var triggerBtn = document.getElementById("mer-chat-trigger");

      $crisp.push(["on", "chat:closed", function() {
        $crisp.push(["do", "chat:hide"]);
        if (triggerBtn) triggerBtn.style.display = "inline-flex";
      }]);
    }]);

    function toggleCustomChat() {
      if (typeof $crisp === "undefined") return;
      var triggerBtn = document.getElementById("mer-chat-trigger");

      if ($crisp.is("chat:opened")) {
        $crisp.push(["do", "chat:close"]);
      } else {
        $crisp.push(["do", "chat:show"]);
        $crisp.push(["do", "chat:open"]);
        if (triggerBtn) triggerBtn.style.display = "none";
      }
    }
  </script>
</head>
<body>

  <!-- 顶部光晕背景 -->
  <div class="glow-bg"></div>

  <!-- 顶部 Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span>MER Finance</span>
    </div>
  </header>

  <!-- 主内容 -->
  <main>
    <div class="hero">
      <span class="hero-tag">7x24 全天候响应</span>
      <h1> MER 客户支持中心</h1>
      <p>为您提供极速、安全、专业的在线咨询服务</p>
    </div>

    <!-- 功能卡片区块 -->
    <div class="grid">
      <div class="card" onclick="toggleCustomChat()">
        <div class="card-icon">⚡</div>
        <h3>业务咨询</h3>
        <p>产品使用与流程引导</p>
      </div>
      <div class="card" onclick="toggleCustomChat()">
        <div class="card-icon">🛡️</div>
        <h3>安全与风控</h3>
        <p>账户安全与交易复核</p>
      </div>
      <div class="card" onclick="toggleCustomChat()">
        <div class="card-icon">💳</div>
        <h3>出入金协助</h3>
        <p>资金划转与进度查询</p>
      </div>
      <div class="card" onclick="toggleCustomChat()">
        <div class="card-icon">💬</div>
        <h3>人工专席</h3>
        <p>一对一技术支持</p>
      </div>
    </div>

    <!-- 常见问题列表 -->
    <div class="section-title">常见问题解答</div>
    <div class="faq-item" onclick="toggleCustomChat()">
      <span>如何进行实名身份认证？</span>
      <span style="color:var(--text-sub)">></span>
    </div>
    <div class="faq-item" onclick="toggleCustomChat()">
      <span>充值到账需要多长时间？</span>
      <span style="color:var(--text-sub)">></span>
    </div>
    <div class="faq-item" onclick="toggleCustomChat()">
      <span>遇到交易异常如何申请拦截？</span>
      <span style="color:var(--text-sub)">></span>
    </div>
  </main>

  <!-- 右下角胶囊按钮 -->
  <button id="mer-chat-trigger" onclick="toggleCustomChat()">
    <span class="status-dot"></span>
    <svg viewBox="0 0 24 24">
      <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
    </svg>
    <span>在线客服</span>
  </button>

</body>
</html>
