<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MERDEX | Support Center</title>
  <style>
    :root {
      --primary: #10B981;
      --primary-glow: rgba(16, 185, 129, 0.4);
      --bg-main: #0B0F17;
      --card-bg: rgba(22, 30, 46, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-title: #FFFFFF;
      --text-sub: #9CA3AF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-title); min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow-x: hidden; }

    /* 关键属性：全局强制隐藏 Crisp 的右下角原生悬浮小气泡与小弹窗，防止重叠 */
    .crisp-client .crisp-1a13tky,
    .crisp-client div[data-is-mini="true"],
    .crisp-client .crisp-k2073d,
    .crisp-client [data-crisp-chat="true"] span[data-role="badge"] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .glow-bg {
      position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
      width: 320px; height: 320px;
      background: radial-gradient(circle, var(--primary-glow) 0%, rgba(11, 15, 23, 0) 70%);
      z-index: 0; pointer-events: none;
    }

    header {
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: blur(12px); background: rgba(11, 15, 23, 0.7);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
    }

    .brand { display: flex; align-items: center; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }

    .lang-btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-border);
      color: var(--text-title); padding: 6px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px;
      cursor: pointer; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent;
    }

    main { flex: 1; padding: 24px 20px 100px; z-index: 1; max-width: 600px; margin: 0 auto; width: 100%; }
    .hero { text-align: center; margin: 16px 0 32px; }
    .banner-img { width: 100%; height: auto; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--card-border); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); display: block; }
    .hero-tag { display: inline-block; padding: 4px 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 20px; color: var(--primary); font-size: 12px; font-weight: 600; margin-bottom: 12px; }
    .hero h1 { font-size: 26px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
    .hero p { color: var(--text-sub); font-size: 14px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 32px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px 16px; backdrop-filter: blur(8px); transition: all 0.2s ease; cursor: pointer; text-decoration: none; color: inherit; display: block; }
    .card:active { transform: scale(0.98); border-color: var(--primary); }
    .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .card p { font-size: 12px; color: var(--text-sub); line-height: 1.4; }

    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .faq-wrapper { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .faq-header { padding: 16px; font-size: 14px; color: #E5E7EB; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 500; }
    .faq-arrow { color: var(--text-sub); transition: transform 0.2s ease; font-size: 12px; }
    .faq-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; background: rgba(0, 0, 0, 0.2); font-size: 13px; color: var(--text-sub); line-height: 1.6; padding: 0 16px; }
    .faq-wrapper.active .faq-arrow { transform: rotate(90deg); color: var(--primary); }
    .faq-wrapper.active .faq-body { max-height: 300px; padding: 12px 16px 16px; border-top: 1px solid rgba(255, 255, 255, 0.04); }

    #mer-chat-trigger {
      position: fixed; bottom: 28px; right: 20px; height: 48px; padding: 0 20px;
      background-color: var(--primary); color: #ffffff; border: none; border-radius: 24px;
      box-shadow: 0 8px 24px var(--primary-glow); display: inline-flex; align-items: center; gap: 8px;
      cursor: pointer; z-index: 99999; font-weight: 600; font-size: 14px; -webkit-tap-highlight-color: transparent;
    }
    .status-dot { width: 8px; height: 8px; background-color: #34D399; border-radius: 50%; box-shadow: 0 0 8px #34D399; }
  </style>

  <script type="text/javascript">
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "9beb0458-5fd0-49c4-ba0c-7f99ab3c851a";

    (function() {
      var d = document;
      var s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();

    $crisp.push(["safe", true]);
    $crisp.push(["set", "theme:color", ["emerald"]]);
    $crisp.push(["do", "chat:hide"]);

    $crisp.push(["on", "session:loaded", function() {
      var triggerBtn = document.getElementById("mer-chat-trigger");

      // 监听 Crisp 关闭事件：恢复我们自己的在线客服按钮并再次隐藏原生气泡
      $crisp.push(["on", "chat:closed", function() {
        $crisp.push(["do", "chat:hide"]);
        if (triggerBtn) triggerBtn.style.display = "inline-flex";
      }]);
    }]);

    function openChat() {
      var triggerBtn = document.getElementById("mer-chat-trigger");
      $crisp.push(["do", "chat:show"]);
      $crisp.push(["do", "chat:open"]);
      
      // 隐藏你自定义的按钮，同时通过注入 JS 样式双重保证隐藏 Crisp 的原生蓝色小圆圈
      if (triggerBtn) triggerBtn.style.display = "none";
      
      setTimeout(function() {
        var style = document.createElement('style');
        style.innerHTML = '.crisp-client div[data-is-mini="true"], .crisp-client span[data-role="badge"] { display: none !important; }';
        document.head.appendChild(style);
      }, 100);
    }

    function toggleFaq(element) {
      element.parentElement.classList.toggle('active');
    }
  </script>
</head>
<body>

  <div class="glow-bg"></div>

  <header>
    <div class="brand"><span>MERDEX</span></div>
    <button class="lang-btn" onclick="toggleLanguage()">🌐 <span id="lang-text">English</span></button>
  </header>

  <main>
    <div class="hero">
      <img src="MERHelpDesk.JPG" alt="MERDEX Banner" class="banner-img">
      <span class="hero-tag" id="t-tag">非托管 · 高速聚合交易</span>
      <h1 id="t-title">MERDEX 支持中心</h1>
      <p id="t-desc">无需 KYC 认证，连接 Web3 钱包即可交易现货与合约</p>
    </div>

    <div class="grid">
      <a class="card" href="https://mer.finance" target="_blank"><h3 id="c1-title">现货兑换 (Swap)</h3><p id="c1-desc">多链快速兑换与滑点</p></a>
      <a class="card" href="https://perp.mer.finance" target="_blank"><h3 id="c2-title">永续合约 (Perps)</h3><p id="c2-desc">高倍杠杆与资金费率</p></a>
      <div class="card" onclick="openChat()"><h3 id="c3-title">钱包与连接</h3><p id="c3-desc">钱包绑定与链上授权</p></div>
      <div class="card" onclick="openChat()"><h3 id="c4-title">订单与持仓</h3><p id="c4-desc">止盈止损与 Pending 撤单</p></div>
    </div>

    <div class="section-title" id="t-faq-title">常见问题解答</div>

    <div class="faq-wrapper">
      <div class="faq-header" onclick="toggleFaq(this)"><span id="f1-title">现货 Swap 交易提示失败或滑点过大怎么办？</span><span class="faq-arrow">▲</span></div>
      <div class="faq-body" id="f1-body">交易失败通常是因为市场价格波动剧烈，导致实际滑点超出了设置的上限。请点击交易页面右上角的设置图标，适当调高“滑点容忍度 (Slippage Tolerance)”或增加 Gas 费重试。</div>
    </div>
  </main>

  <button id="mer-chat-trigger" onclick="openChat()">
    <span class="status-dot"></span>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
    <span id="t-btn">在线客服</span>
  </button>

</body>
</html>
