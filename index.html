<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MER 客户支持服务</title>
  <style>
    :root {
      /* 核心配色 (使用您提供的绿色与深色) */
      --primary-color: #10B981;    /* 品牌绿 */
      --primary-hover: #059669;   /* 绿色悬停色 */
      --bg-dark: #0b0f17;         /* 深色背景 */
      --panel-dark: #1f2937;      /* 聊天面板深色背景 */
      --text-main: #ffffff;        /* 主文字色 */
      --text-sub: #9ca3af;        /* 副文字色 */
    }

    /* 全局复位 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden; /* 防止页面整体滚动 */
    }

    /* * 1. 完美复刻并优化的胶囊客服按钮 
     */
    #mer-chat-trigger {
      position: fixed;
      bottom: 28px;
      right: 20px;
      height: 48px;
      padding: 0 18px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 999989;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* 优化 1：Hover 时更强烈的动效与阴影 */
    #mer-chat-trigger:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(16, 185, 129, 0.45);
    }

    /* 优化 2：Active 时的回弹点击感 */
    #mer-chat-trigger:active {
      transform: translateY(0) scale(0.96);
    }

    #mer-chat-trigger svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* 状态指示灯（呼吸灯动效） */
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #34D399;
      border-radius: 50%;
      position: relative;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #34D399;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /*
     * 2. 隐藏 Crisp 原生样式 (精细化)
     */
    /* 隐藏原生启动图标 */
    .crisp-client a[data-crisp-element="chat:icon"] {
      display: none !important;
    }
    
    /* 隐藏未读消息泡泡（交给自定义处理） */
    .crisp-client div[data-crisp-element="chat:unread"] {
      display: none !important;
    }

    /* 精细调整：确保 Crisp 面板打开时层级正确且位置贴合 */
    .crisp-client .cc-kv30 {
      z-index: 999990 !important;
      bottom: 0 !important;
      right: 0 !important;
    }

    /*
     * 3. (可选) 聊天面板的深色模式优化美化
     * 注意：如果需要在 Crisp 平台内深度定制面板内部样式，
     * 可能需要用到 Crisp 提供的 CSS 重写或内嵌。这里提供基础的 CSS 复写。
     */
    .crisp-client[data-theme="emerald"] {
      --crisp-theme-main-color: var(--primary-color);
      --crisp-theme-bg-color: var(--panel-dark);
      --crisp-theme-text-color: var(--text-main);
    }

    /* 自定义面板背景色 (如果 Crisp 默认未适配深色模式) */
    .crisp-client .cc-window .cc-body {
      background-color: var(--panel-dark) !important;
    }
    
    .crisp-client .cc-message .cc-text {
      background-color: var(--panel-dark);
      color: var(--text-main);
    }
    
    .crisp-client .cc-input {
      background-color: #374151 !important; /* 更深一点的输入框 */
      color: var(--text-main) !important;
    }

  </style>
