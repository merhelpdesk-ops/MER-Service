<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MER Protocol | DEX Support</title>
  <style>
    :root {
      --primary: #10B981;
      --primary-glow: rgba(16, 185, 129, 0.4);
      --bg-main: #0B0F17;
      --card-bg: rgba(22, 30, 46, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-title: #FFFFFF;
      --text-sub: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-title);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    .glow-bg {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--primary-glow) 0%, rgba(11, 15, 23, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      background: rgba(11, 15, 23, 0.7);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #10B981, #059669);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    /* 语言切换按钮组件 */
    .lang-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-title);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .lang-btn:active {
      transform: scale(0.95);
      border-color: var(--primary);
    }

    main {
      flex: 1;
      padding: 24px 20px 100px;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .hero {
      text-align: center;
      margin: 16px 0 32px;
    }

    .hero-tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .hero h1 {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--text-sub);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .card:active {
      transform: scale(0.98);
      border-color: var(--primary);
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .card h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card p {
      font-size: 12px;
      color: var(--text-sub);
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .faq-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #E5E7EB;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    #mer-chat-trigger {
      position: fixed;
      bottom: 28px;
      right: 20px;
      height: 48px;
      padding: 0 20px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 24px;
      box-shadow: 0 8px 24px var(--primary-glow);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 999999;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #mer-chat-trigger:active {
      transform: scale(0.95);
    }

    #mer-chat-trigger svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #34D399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34D399;
    }
  </style>

  <!-- Crisp SDK -->
  <script type="text/javascript">
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "9beb0458-5fd0-49c4-ba0c-7f99ab3c851a";

    (function() {
      var d = document;
      var s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();

    $crisp.push(["safe", true]);
    $crisp.push(["set", "theme:color", ["emerald"]]);
    $crisp.push(["do", "chat:hide"]);

    $crisp.push(["on", "session:loaded", function() {
      var triggerBtn = document.getElementById("mer-chat-trigger");

      $crisp.push(["on", "chat:closed", function() {
        $crisp.push(["do", "chat:hide"]);
        if (triggerBtn) triggerBtn.style.display = "inline-flex";
      }]);
    }]);

    function toggleCustomChat() {
      if (typeof $crisp === "undefined") return;
      var triggerBtn = document.getElementById("mer-chat-trigger");

      if ($crisp.is("chat:opened")) {
        $crisp.push(["do", "chat:close"]);
      } else {
        $crisp.push(["do", "chat:show"]);
        $crisp.push(["do", "chat:open"]);
        if (triggerBtn) triggerBtn.style.display = "none";
      }
    }
  </script>
</head>
<body>

  <div class="glow-bg"></div>

  <!-- Header 含有语言切换按钮 -->
  <header>
    <div class="brand">
      <div class="brand-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span>MER Protocol</span>
    </div>
    <button class="lang-btn" onclick="toggleLanguage()">
      🌐 <span id="lang-text">English</span>
    </button>
  </header>

  <main>
    <div class="hero">
      <span class="hero-tag" id="t-tag">非托管 · 完全去中心化</span>
      <h1 id="t-title">MER 支持中心</h1>
      <p id="t-desc">无需 KYC 认证，通过 WalletConnect 即可安全交易</p>
    </div>

    <!-- 4 个核心卡片 -->
    <div class="grid">
      <div class="card" onclick="toggleCustomChat()">
        <div class="card-icon">🦊</div>
        <h3 id="c1-title">钱包连接</h3>
        <p id="c1-desc">MetaMask / OKX 连线</p>
      </div>
      <div class="card" onclick="toggleCustomChat()">
        <div class="card-icon">⚡</div>
        <h3 id="c2-title">兑换与滑点</h3>
        <p id="c2-desc">Swap 交易与 Gas 费</p>
      </div>
      <div class="card" onclick="toggleCustomChat()">
        <div class="card-icon">💧</div>
        <h3 id="c3-title">流动性池</h3>
        <p id="c3-desc">添加 LP 与 Yield 收益</p>
      </div>
      <div class="card" onclick="toggleCustomChat()">
        <div class="card-icon">🛠️</div>
        <h3 id="c4-title">链上问题</h3>
        <p id="c4-desc">交易 Pending 与 撤单</p>
      </div>
    </div>

    <!-- FAQ 常见问题 -->
    <div class="section-title" id="t-faq-title">常见问题解答</div>
    <div class="faq-item" onclick="toggleCustomChat()">
      <span id="f1-title">为什么 Swap 提示交易失败 (Transaction Failed)？</span>
      <span style="color:var(--text-sub)">></span>
    </div>
    <div class="faq-item" onclick="toggleCustomChat()">
      <span id="f2-title">如何在 DEX 调整 Gas 费与滑点容忍度 (Slippage)？</span>
      <span style="color:var(--text-sub)">></span>
    </div>
    <div class="faq-item" onclick="toggleCustomChat()">
      <span id="f3-title">授权智能合约 (Approve) 的安全性与解除授权</span>
      <span style="color:var(--text-sub)">></span>
    </div>
  </main>

  <!-- 右下角悬浮按钮 -->
  <button id="mer-chat-trigger" onclick="toggleCustomChat()">
    <span class="status-dot"></span>
    <svg viewBox="0 0 24 24">
      <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
    </svg>
    <span id="t-btn">在线客服</span>
  </button>

  <!-- 语言切换脚本逻辑 -->
  <script>
    let currentLang = 'zh';

    const i18n = {
      zh: {
        langBtn: "English",
        tag: "非托管 · 完全去中心化",
        title: "MER 支持中心",
        desc: "无需 KYC 认证，通过 WalletConnect 即可安全交易",
        c1Title: "钱包连接",
        c1Desc: "MetaMask / OKX 连线",
        c2Title: "兑换与滑点",
        c2Desc: "Swap 交易与 Gas 费",
        c3Title: "流动性池",
        c3Desc: "添加 LP 与 Yield 收益",
        c4Title: "链上问题",
        c4Desc: "交易 Pending 与 撤单",
        faqTitle: "常见问题解答",
        f1: "为什么 Swap 提示交易失败 (Transaction Failed)？",
        f2: "如何在 DEX 调整 Gas 费与滑点容忍度 (Slippage)？",
        f3: "授权智能合约 (Approve) 的安全性与解除授权",
        chatBtn: "在线客服"
      },
      en: {
        langBtn: "中文",
        tag: "Non-Custodial · Fully Decentralized",
        title: "MER Support Center",
        desc: "No KYC required. Trade securely via WalletConnect.",
        c1Title: "Wallet Connection",
        c1Desc: "MetaMask / OKX Wallet",
        c2Title: "Swap & Slippage",
        c2Desc: "Swap rules & Gas fees",
        c3Title: "Liquidity Pools",
        c3Desc: "Add LP & Yield farming",
        c4Title: "On-Chain Issues",
        c4Desc: "Pending tx & Cancellations",
        faqTitle: "Frequently Asked Questions",
        f1: "Why did my Swap transaction fail?",
        f2: "How to adjust Gas fee & Slippage tolerance?",
        f3: "Smart contract approval safety & Revoke allowance",
        chatBtn: "Live Support"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      const data = i18n[currentLang];

      document.getElementById('lang-text').innerText = data.langBtn;
      document.getElementById('t-tag').innerText = data.tag;
      document.getElementById('t-title').innerText = data.title;
      document.getElementById('t-desc').innerText = data.desc;

      document.getElementById('c1-title').innerText = data.c1Title;
      document.getElementById('c1-desc').innerText = data.c1Desc;
      document.getElementById('c2-title').innerText = data.c2Title;
      document.getElementById('c2-desc').innerText = data.c2Desc;
      document.getElementById('c3-title').innerText = data.c3Title;
      document.getElementById('c3-desc').innerText = data.c3Desc;
      document.getElementById('c4-title').innerText = data.c4Title;
      document.getElementById('c4-desc').innerText = data.c4Desc;

      document.getElementById('t-faq-title').innerText = data.faqTitle;
      document.getElementById('f1-title').innerText = data.f1;
      document.getElementById('f2-title').innerText = data.f2;
      document.getElementById('f3-title').innerText = data.f3;

      document.getElementById('t-btn').innerText = data.chatBtn;

      // 同步 Crisp 客服对话框语言环境
      if (typeof $crisp !== "undefined") {
        $crisp.push(["set", "session:language", [currentLang]]);
      }
    }
  </script>

</body>
</html>
