<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MER 客户支持服务</title>
  <style>
    :root {
      --primary-color: #10B981;
      --primary-hover: #059669;
      --bg-dark: #121827;
    }

    /* 1. 深度隐藏 Crisp 原生 Logo、悬浮球和底部水印 */
    .crisp-client .cc-kv30, 
    .crisp-client .cc-un82,
    .crisp-client .cc-1896, /* 隐藏官方水印标志 */
    div[data-crisp-has-chat="true"] {
      display: none !important;
    }

    /* 2. 重写 Crisp 主窗口样式（改造成优雅的现代暗色/高亮绿风） */
    .crisp-client .cc-kx21 {
      border-radius: 16px !important;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25) !important;
      overflow: hidden !important;
    }

    /* 3. 自定义外部触发展示按钮 */
    #mer-chat-trigger {
      position: fixed;
      bottom: 28px;
      right: 28px;
      height: 52px;
      padding: 0 20px;
      background-color: var(--primary-color);
      color: #ffffff;
      border-radius: 26px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #mer-chat-trigger:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.45);
    }

    #mer-chat-trigger svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* 在线状态点 */
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #34D399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34D399;
    }
  </style>

  <script type="text/javascript">
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "9beb0458-5fd0-49c4-ba0c-7f99ab3c851a";
    (function() {
      d = document;
      s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();

    // SDK 自定义动作：隐去原生浮球并定制颜色
    $crisp.push(["safe", true]);
    $crisp.push(["do", "chat:hide"]);
    $crisp.push(["config", "container:insert", ["html"]]);
    
    // 设置主题主色调为 MER 绿
    $crisp.push(["set", "theme:color", ["emerald"]]);

    // 交互逻辑
    function toggleCustomChat() {
      if ($crisp.is("chat:opened")) {
        $crisp.push(["do", "chat:close"]);
      } else {
        $crisp.push(["do", "chat:open"]);
        $crisp.push(["do", "chat:show"]);
      }
    }
  </script>
</head>
<body style="background-color: #0b0f17;">

  <div id="mer-chat-trigger" onclick="toggleCustomChat()">
    <span class="status-dot"></span>
