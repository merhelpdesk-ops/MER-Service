<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MERDEX | MERHelpDesk</title>
  
  <link rel="icon" type="image/webp" href="favicon.webp">

  <style>
    :root {
      --primary: #10B981;
      --primary-glow: rgba(16, 185, 129, 0.4);
      --bg-main: #0B0F17;
      --card-bg: rgba(22, 30, 46, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-title: #FFFFFF;
      --text-sub: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-title);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    .glow-bg {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--primary-glow) 0%, rgba(11, 15, 23, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      background: rgba(11, 15, 23, 0.7);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .lang-switcher {
      display: flex;
      gap: 6px;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      color: var(--text-title);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .lang-btn.active {
      background: var(--primary);
      color: #000;
      font-weight: 600;
      border-color: var(--primary);
    }

    main {
      flex: 1;
      padding: 24px 20px 100px;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .hero {
      text-align: center;
      margin: 16px 0 32px;
    }

    .banner-img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: block;
    }

    .hero-tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .hero h1 {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--text-sub);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 16px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:active {
      transform: scale(0.98);
      border-color: var(--primary);
    }

    .card h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .faq-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .faq-header {
      padding: 16px;
      font-size: 14px;
      color: #E5E7EB;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 500;
      line-height: 1.4;
    }

    .faq-arrow {
      color: var(--text-sub);
      transition: transform 0.2s ease;
      font-size: 12px;
      margin-left: 10px;
    }

    .faq-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      background: rgba(0, 0, 0, 0.2);
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.6;
      padding: 0 16px;
    }

    .faq-body a {
      color: var(--primary);
      text-decoration: underline;
      word-break: break-all;
    }

    .faq-wrapper.active .faq-arrow {
      transform: rotate(90deg);
      color: var(--primary);
    }

    .faq-wrapper.active .faq-body {
      max-height: 500px;
      padding: 12px 16px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    #mobile-tawk-widget {
      display: none;
    }

    .tawk-mobile-native-hidden iframe[src="about:blank"][referrerpolicy="no-referrer-when-downgrade"][style*="max-width:124px"] {
      transform: translateX(200vw) !important;
      -webkit-transform: translateX(200vw) !important;
    }

    #mobile-tawk-widget.is-visible {
      align-items: center;
      background: #1595ad;
      border: 0;
      border-radius: 50%;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 5px 18px rgba(21, 149, 173, 0.4);
      color: #fff;
      cursor: grab;
      display: flex;
      height: 44px;
      justify-content: center;
      padding: 0;
      position: fixed;
      right: 16px;
      touch-action: none;
      user-select: none;
      width: 44px;
      z-index: 2000000001;
    }

    #mobile-tawk-widget.is-dragging {
      cursor: grabbing;
      transform: scale(0.96);
    }

    @media (min-width: 1001px) {
      #mobile-tawk-widget.is-visible {
        bottom: 30px;
        right: 20px;
      }
    }
  </style>

  <script type="text/javascript">
    var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
    Tawk_API.lang = 'en';
    var mobileTawkPositionKey = 'merdex-mobile-tawk-position';
    Tawk_API.autoStart = false;
    document.documentElement.classList.add('tawk-mobile-native-hidden');

    function isMobileTawkScreen() {
      return true;
    }

    function getMobileTawkWidget() {
      return document.getElementById('mobile-tawk-widget');
    }

    function showMobileTawkWidget(visible) {
      var widget = getMobileTawkWidget();
      if (widget) widget.classList.toggle('is-visible', visible && isMobileTawkScreen());
    }

    function hideNativeMobileTawkWidget(hidden) {
      document.documentElement.classList.toggle(
        'tawk-mobile-native-hidden',
        hidden && isMobileTawkScreen()
      );
    }

    function clampMobileTawkWidget() {
      var widget = getMobileTawkWidget();
      if (!widget || !widget.classList.contains('is-visible')) return;
      var rect = widget.getBoundingClientRect();
      var left = Math.max(0, Math.min(rect.left, window.innerWidth - rect.width));
      var top = Math.max(0, Math.min(rect.top, window.innerHeight - rect.height));
      widget.style.left = left + 'px';
      widget.style.top = top + 'px';
      widget.style.right = 'auto';
      widget.style.bottom = 'auto';
    }

    function restoreMobileTawkPosition() {
      var widget = getMobileTawkWidget();
      if (!widget) return;
      try {
        var position = JSON.parse(localStorage.getItem(mobileTawkPositionKey));
        if (position && Number.isFinite(position.left) && Number.isFinite(position.top)) {
          widget.style.left = position.left + 'px';
          widget.style.top = position.top + 'px';
          widget.style.right = 'auto';
          widget.style.bottom = 'auto';
        }
      } catch (error) { }
      requestAnimationFrame(clampMobileTawkWidget);
    }
